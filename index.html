<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواعيدي | صالونات رجال</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:'Cairo',sans-serif}.hidden{display:none!important}</style></head><body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-white shadow-sm sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-3"><button onclick="show('home')" class="flex items-center gap-3"><span class="bg-blue-600 text-white p-2.5 rounded-xl text-xl">✂️</span><span><b id="brandTitle" class="block text-xl font-black">مواعيدي لصالونات الرجال</b><small id="brandSubtitle" class="text-slate-500"></small></span></button><button onclick="show('auth')" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-sm">دخول / تسجيل صالون</button></div></header>
<main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
<section id="home" class="space-y-8"><div class="bg-gradient-to-r from-blue-600 to-sky-600 text-white rounded-3xl p-8 md:p-12 shadow-xl text-center space-y-4"><h1 id="heroTitle" class="text-3xl md:text-5xl font-black"></h1><p id="heroText" class="text-sky-50 max-w-2xl mx-auto"></p><div class="max-w-3xl mx-auto bg-white p-3 rounded-2xl flex flex-col md:flex-row gap-3"><select id="govFilter" class="bg-slate-100 rounded-xl px-4 py-3 text-slate-700"></select><input id="q" placeholder="ابحث باسم الصالون..." class="flex-grow bg-slate-100 rounded-xl px-4 py-3 text-slate-700"><button onclick="renderSalons()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black">بحث</button></div></div><div><div class="flex justify-between mb-4"><h2 class="text-xl font-black">الصالونات المتاحة</h2><span id="count" class="text-sm bg-slate-200 px-3 py-1 rounded-full"></span></div><div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div></div></section>
<section id="booking" class="hidden max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-8 space-y-5"><button onclick="show('home')" class="text-blue-700 font-bold">← العودة</button><h2 id="bookingTitle" class="text-xl font-black"></h2><form id="bookingForm" class="space-y-4"><input type="hidden" id="salonId"><input id="clientName" required maxlength="80" placeholder="الاسم" class="w-full bg-slate-50 border rounded-xl px-4 py-3"><input id="clientPhone" required maxlength="16" placeholder="رقم الهاتف" class="w-full bg-slate-50 border rounded-xl px-4 py-3"><input id="bookTime" type="datetime-local" required class="w-full bg-slate-50 border rounded-xl px-4 py-3"><button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">تأكيد الحجز</button></form></section>
<section id="auth" class="hidden max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 space-y-5"><div class="flex gap-2 justify-center"><button onclick="tab('login')" class="font-black text-blue-700">دخول</button><button onclick="tab('signup')" class="font-black text-blue-700">إضافة صالون</button></div><form id="loginForm" class="space-y-4"><input id="loginUser" required placeholder="اسم المستخدم" class="w-full border rounded-xl px-4 py-3"><input id="loginPass" type="password" required placeholder="كلمة المرور" class="w-full border rounded-xl px-4 py-3"><button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">دخول</button></form><form id="signupForm" class="space-y-4 hidden"><input id="regName" required placeholder="اسم الصالون" class="w-full border rounded-xl px-4 py-3"><select id="regGov" required class="w-full border rounded-xl px-4 py-3"></select><input id="regPhone" required placeholder="رقم صاحب الصالون" class="w-full border rounded-xl px-4 py-3"><input id="regUser" required placeholder="اسم المستخدم" class="w-full border rounded-xl px-4 py-3"><input id="regPass" type="password" minlength="10" required placeholder="كلمة المرور - 10 أحرف على الأقل" class="w-full border rounded-xl px-4 py-3"><button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">إنشاء الحساب</button></form></section>
<section id="dashboard" class="hidden max-w-5xl mx-auto space-y-6"><div class="bg-white rounded-3xl p-6 shadow flex justify-between"><div><h2 id="dashName" class="text-2xl font-black"></h2><p id="dashMeta" class="text-sm text-slate-500"></p></div><button onclick="logoutSalon()" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-xl font-bold">خروج</button></div><div class="bg-white rounded-3xl p-6 shadow"><h3 class="font-black mb-4">الاشتراك</h3><div id="plans" class="grid sm:grid-cols-2 gap-3"></div></div><div class="bg-white rounded-3xl p-6 shadow"><h3 class="font-black mb-4">الحجوزات</h3><div id="bookings"></div></div></section>
</main><footer class="bg-white border-t py-6 text-center text-sm text-slate-500">جميع الحقوق محفوظة © مواعيدي 2026 · <a href="/admin.html" class="text-blue-600">إدارة الموقع</a></footer><div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-xl"></div>
<script src="/app.js"></script></body></html>
