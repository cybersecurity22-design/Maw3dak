<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة موقع صالونات الرجال</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Cairo',sans-serif}.hidden{display:none!important}</style></head><body class="bg-slate-100 text-slate-800 min-h-screen"><header class="bg-slate-950 text-white"><div class="max-w-6xl mx-auto px-4 py-5 flex justify-between"><div><div class="text-xs text-blue-300 font-bold">لوحة الإدارة الآمنة</div><h1 class="text-2xl font-black">إدارة موقع صالونات الرجال</h1></div><a href="/" class="bg-white/10 px-4 py-2 rounded-xl">فتح الموقع</a></div></header><main class="max-w-6xl mx-auto p-4 md:p-6"><section id="loginBox" class="max-w-md mx-auto mt-12 bg-white rounded-3xl shadow p-7"><h2 class="text-2xl font-black text-center mb-5">دخول الأدمن</h2><form id="loginForm" class="space-y-4"><input id="pass" type="password" required placeholder="كلمة مرور الإدارة" class="w-full border rounded-xl px-4 py-3"><button class="w-full bg-slate-950 text-white py-3 rounded-xl font-black">دخول</button></form></section><section id="panel" class="hidden space-y-6"><form id="siteForm" class="bg-white rounded-3xl shadow p-6 space-y-3"><h2 class="text-xl font-black">محتوى الموقع</h2><input id="brandTitle" class="w-full border rounded-xl px-4 py-3" placeholder="اسم الموقع"><input id="brandSubtitle" class="w-full border rounded-xl px-4 py-3" placeholder="الوصف الصغير"><input id="heroTitle" class="w-full border rounded-xl px-4 py-3" placeholder="العنوان الرئيسي"><textarea id="heroText" class="w-full border rounded-xl px-4 py-3"></textarea><button class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">حفظ</button></form><form id="planForm" class="bg-white rounded-3xl shadow p-6 grid md:grid-cols-2 gap-3"><h2 class="md:col-span-2 text-xl font-black">إضافة اشتراك</h2><input id="planName" required class="border rounded-xl px-4 py-3" placeholder="اسم الخطة"><input id="planPrice" required type="number" min="0" step="0.01" class="border rounded-xl px-4 py-3" placeholder="السعر"><input id="planDays" required type="number" min="1" class="border rounded-xl px-4 py-3" placeholder="عدد الأيام"><input id="planLink" type="url" class="border rounded-xl px-4 py-3" placeholder="رابط دفع HTTPS"><button class="md:col-span-2 bg-blue-600 text-white py-3 rounded-xl font-black">إضافة</button><div id="plans" class="md:col-span-2 space-y-2"></div></form><form id="bankForm" class="bg-white rounded-3xl shadow p-6 grid md:grid-cols-2 gap-3"><h2 class="md:col-span-2 text-xl font-black">الحساب البنكي</h2><input id="bankName" class="border rounded-xl px-4 py-3" placeholder="اسم البنك"><input id="holder" class="border rounded-xl px-4 py-3" placeholder="صاحب الحساب"><input id="iban" class="border rounded-xl px-4 py-3" placeholder="IBAN"><input id="accountNumber" class="border rounded-xl px-4 py-3" placeholder="رقم الحساب"><button class="md:col-span-2 bg-blue-600 text-white py-3 rounded-xl font-black">حفظ</button></form><div class="bg-white rounded-3xl shadow p-6"><h2 class="text-xl font-black mb-4">الصالونات</h2><div id="salons" class="space-y-3"></div></div><form id="passwordForm" class="bg-white rounded-3xl shadow p-6 space-y-3"><h2 class="text-xl font-black">تغيير كلمة مرور الأدمن</h2><input id="newPassword" type="password" minlength="12" required class="w-full border rounded-xl px-4 py-3" placeholder="12 حرفاً على الأقل"><button class="w-full bg-slate-950 text-white py-3 rounded-xl font-black">تغيير كلمة المرور</button></form><button id="logout" class="bg-rose-600 text-white px-5 py-3 rounded-xl font-black">تسجيل خروج</button></section></main><div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-950 text-white px-5 py-3 rounded-xl"></div><script src="/admin.js"></script></body></html>
